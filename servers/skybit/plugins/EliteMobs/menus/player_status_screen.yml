  # Modern combat summary shown in the Gear dialog.
  # Placeholders: $combatLevel, $referenceLevel, $weaponLevel, $weaponSkill,
  # $weaponSkillLevel, $weaponFactor, $critChance, $enchantmentBonus, $weaponPerks,
  # $armorLevel, $armorSkillLevel, $defenseMatch, $health, $maxHealth, $armorPerks
  # and $threatMultiplier.
  gearSummaryLines:
  - <g:#A63D2F:#E97932>⚔ Equipment Matchup</g>
  - '<g:#B8860B:#F0C040>Combat Level</g>: &f$combatLevel'
  - '<g:#A63D2F:#E97932>Held Weapon</g>: &fLv. $weaponLevel &8• &7$weaponSkill: &fLv.
    $weaponSkillLevel'
  - '<g:#A63D2F:#E97932>Weapon factor vs Lv.</g> &f$referenceLevel: &f×$weaponFactor'
  - '<g:#A04468:#E07A9A>Critical chance</g>: &f$critChance% &8• &7Equipment bonus:
    &f+$enchantmentBonus%'
  - '&7Selected weapon perks: &f$weaponPerks'
  - '<g:#355CA8:#5FA9E8>Melee armor</g>: &f$armorLevel &8• &7Armor Skill: &fLv. $armorSkillLevel'
  - '<g:#355CA8:#5FA9E8>Melee reduction vs Lv.</g> &f$referenceLevel: &f$defenseMatch%'
  - '<g:#2E7D4F:#69C56F>Health</g>: &f$health&7/&f$maxHealth'
  - '&7Selected armor perks: &f$armorPerks'
  - '<g:#B8860B:#F0C040>Threat generated</g>: &f×$threatMultiplier'
  - '&8Equipment matchup only; skills and temporary effects apply in combat.'
  # Weapon skill label shown when no recognized weapon is held.
  gearUnarmedLabel: Unarmed
  # Text shown in the Combat Gear profile when no applicable perks are selected.
  gearNoSelectedPerksLabel: None selected
  gearHelmetLabel: Helmet
  gearChestplateLabel: Chestplate
  gearLeggingsLabel: Leggings
  gearBootsLabel: Boots
  gearMainHandLabel: Main Hand
  gearOffHandLabel: Off Hand
  # Fallback quest label used when a quest has no configured display name.
  # Available placeholder: $id.
  questFallbackFormat: Quest $id
  # Title for the main player status dialog menu.
  titlePlayerStatus: <g:#8B0000:#CC4400:#DAA520>EliteMobs</g> &7Menu
  # Title for the Stats dialog section.
  titleStats: <g:#B8860B:#F0C040>★ Adventure Record</g>
  # Title for the Gear dialog section.
  titleGear: <g:#A63D2F:#E97932>⚔ Combat Gear</g>
  # Title for the Teleports dialog section.
  titleTeleports: <g:#355CA8:#5FA9E8>↔ Teleports</g>
  # Title for the Quick Actions dialog section.
  titleCommands: <g:#267A78:#58B8A9>⚡ Quick Actions</g>
  # Title for the Quests dialog section.
  titleQuests: <g:#2E7D4F:#69C56F>✉ Quests</g>
  # Title for the Boss Tracking dialog section.
  titleBossTracking: <g:#7A1F2B:#C2414A>☠ Boss Tracker</g>
  # Title for the Skills dialog section.
  titleSkills: <g:#6D3AA8:#A855F7>⚗ Skills</g>
  # Title for the Party dialog section.
  titleParty: <g:#A04468:#E07A9A>♥ Party</g>
  # Description shown on the Party dialog section.
  partyDescription: '&7Team up with as many as four other players. Parties share nearby
    quest progress, vote on loot, and enter dungeons together.'
  # Button used to create a party.
  partyCreateButton: <g:#2E7D4F:#69C56F>+ Create a Party</g>
  # Button used to prepare the party invite command.
  partyInviteButton: <g:#267A78:#58B8A9>✉ Invite a Player</g>
  # Button used to leave a party.
  partyLeaveButton: <g:#7A1F2B:#C2414A>✘ Leave Party</g>
  # Title for the dialog that lists players available for a party invitation.
  partyInviteTitle: <g:#A04468:#E07A9A>✉ Invite a Player</g>
  # Button for an available party invite target. Use $player for their name.
  partyInvitePlayerButton: <g:#267A78:#58B8A9>✉ Invite</g> &f$player
  # Tooltip for a party invite target. Use $player for their name.
  partyInvitePlayerTooltip: '&7Invite $player to your party.'
  # Message shown when nobody online can currently be invited.
  partyInviteNoPlayers: '&7No available players are online right now.'
  # Message shown when the player has no active quests.
  noActiveQuests: No active quests
  # Message shown when there are no bosses available to track.
  noTrackableBosses: '&7No trackable bosses are currently active.'
