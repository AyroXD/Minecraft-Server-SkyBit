# JobsPlus Configuration File

# Storage Settings
storage:
  type: JSON
  mysql:
    host: localhost
    port: 3306
    database: jobsplus
    username: root
    password: password
  auto-save-interval: 5

# General Settings
settings:
  max-jobs: 2
  secondary-job-multiplier: 0.7
  job-switch-cooldown: 300
  enable-bossbar: true
  enable-actionbar: true
  leaderboard-update-interval: 300
  max-prestige: 10

# Visual Effects
visual-effects:
  enabled: true
  particles:
    level-up: true
    xp-gain: true
    milestone: true
    prestige: true
    job-join: true
  sounds:
    level-up: true
    xp-gain: false
    milestone: true
    prestige: true

# XP Settings
xp:
  base: 100
  level-multiplier: 50
  level-square-multiplier: 10
  enable-catchup: true
  catchup-bonus-percent: 25

# Milestone Rewards (Enhanced System)
milestones:
  enabled: true
  levels:
    - 5
    - 10
    - 15
    - 20
    - 25
    - 30
    - 40
    - 50
    - 60
    - 75
    - 90
    - 100
  money-rewards:
    5: 250
    10: 750
    15: 1200
    20: 2000
    25: 3500
    30: 5000
    40: 8000
    50: 12000
    60: 15000
    75: 25000
    90: 35000
    100: 50000

# Prestige System
prestige:
  enabled: true
  multiplier-per-level: 0.1
  require-max-level: true
  reset-on-prestige: true

# Seasonal Events
seasonal-events:
  enabled: true
  auto-activate: true

  events:
    winter-festival:
      enabled: true
      xp-multiplier: 2.0
      money-multiplier: 2.0

    spring-bloom:
      enabled: true
      xp-multiplier: 2.5
      money-multiplier: 2.5

    summer-adventure:
      enabled: true
      xp-multiplier: 3.0
      money-multiplier: 2.0

    autumn-harvest:
      enabled: true
      xp-multiplier: 2.0
      money-multiplier: 2.5

# Booster System
boosters:
  enabled: true
  max-personal-boosters: 5
  stack-multipliers: true

# Random Events
events:
  enabled: true
  spawn-chance: 5
  max-concurrent: 3
  min-duration: 10
  max-duration: 20
  min-multiplier: 1.5
  max-multiplier: 2.0

# Job Unlock Requirements
job-unlocks:
  enabled: false
  requirements:
    alchemist:
      required-job: ENCHANTER
      required-level: 25
    excavator:
      required-job: MINER
      required-level: 20
    beast-master:
      required-job: FARMER
      required-level: 30
    assassin:
      required-job: HUNTER
      required-level: 40

# Anti-Exploit
anti-exploit:
  enabled: true
  max-actions-per-second: 15
  reset-after-seconds: 5

# Recommendations
recommendations:
  enabled: true
  recommend-count: 3

# Daily Goals
daily-goals:
  enabled: true
  goals-per-day: 5
  reset-time: "00:00"
  reward-multiplier: 1.5

# Skill Trees
skill-trees:
  enabled: true
  max-unlocked-per-tree: 10
  unlock-cost-multiplier: 1.5

# Leaderboards
leaderboards:
  enabled: true
  show-top: 15
  update-interval: 300
  display-prestige: true

# Marketplace
marketplace:
  enabled: true
  listing-duration-hours: 24
  max-listings-per-player: 5
  tax-percentage: 5

# Job XP Rewards
