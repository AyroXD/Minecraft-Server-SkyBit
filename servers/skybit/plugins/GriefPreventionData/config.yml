# Default values are perfect for most servers.  If you want to customize and have a question, look for the answer here first: http://dev.bukkit.org/bukkit-plugins/grief-prevention/pages/setup-and-configuration/
#
# Locale settings:
#   GriefPrevention.Locale: Set to 'es' for Spanish, 'pt_BR' for Brazilian Portuguese, or 'en' for English.
#   To use localized messages, copy messages_XX.yml from the Lang/ folder to GriefPreventionData/ and rename it to messages.yml.
#   If no messages.yml exists, the plugin will use messages_XX.yml from Lang/ based on this locale setting.
#   GriefPrevention.PerPlayerLocale: If true, send messages in the player's client language (if supported).
#     Players with Spanish client locale will receive Spanish messages, Portuguese will receive Portuguese.
#     Players with unsupported locales will receive the server's default locale.

GriefPrevention:
  SeaLevelOverrides:
    world: -1
    world_nether: -1
    world_the_end: -1
  Claims:
    MaximumDepth:
      Default: -2147483648
      world: -2147483648
      world_nether: -2147483648
      world_the_end: -2147483648
    Mode:
      world_the_end: Disabled
      world_nether: Disabled
      world: Survival
    PreventGlobalMonsterEggs: true
    PreventTheft: true
    ProtectCreatures: true
    PreventButtonsSwitches: true
    LockWoodenDoors: false
    LockTrapDoors: false
    LockFenceGates: true
    EnderPearlsRequireAccessTrust: true
    RefundDeniedEnderPearls: true
    RaidTriggersRequireBuildTrust: true
    ProtectHorses: true
    ProtectDonkeys: true
    ProtectLlamas: true
    InitialBlocks: 500
    Claim Blocks Accrued Per Hour:
      Default: 200
    Max Accrued Claim Blocks:
      Default: 20000
    Accrued Idle Threshold: 5
    AccruedIdlePercent: 0
    AbandonReturnRatio: 1.0
    AutomaticNewPlayerClaimsRadius: 4
    AutomaticNewPlayerClaimsRadiusMinimum: 0
    ExtendIntoGroundDistance: 5
    MinimumWidth: 5
    MinimumArea: 100
    ShapedMinimumWidth: 1
    ShapedMinimumArea: 25
    MinimumY: -2147483648
    MinimumDistance: 0
    PreventLavaPlaceNearClaims: true
    CreationRequiresWorldGuardBuildPermission: true
    InvestigationTool: STICK
    ModificationTool: GOLDEN_SHOVEL
    Expiration:
      ChestClaimDays: 7
      UnusedClaimDays: 14
      AllClaims:
        DaysInactive: 60
        ExceptWhenOwnerHasTotalClaimBlocks: 10000
        ExceptWhenOwnerHasBonusClaimBlocks: 5000
      AutomaticNatureRestoration:
        SurvivalWorlds: false
    AllowTrappedInAdminClaims: false
    AllowNestedSubClaims: false
    AllowShapedClaims: false
    AllowShapedSubClaims: false
    UseClaimSelectSessions: true
    UseClaimSelectedMessages: false
    LegacySubdivisionFormat: false
    MaximumNumberOfClaimsPerPlayer: 0
    VillagerTradingRequiresPermission: true
    CommandsRequiringAccessTrust: /sethome
    DeliverManuals: true
    ManualDeliveryDelaySeconds: 30
    RavagersBreakBlocks: true
    FireSpreadsInClaims: false
    FireDamagesInClaims: false
    LecternReadingRequiresAccessTrust: true
    HoppersRequireBuildTrust: false
    UnprotectedChestWarningCooldownSeconds: 300
    UnprotectedChestWarningDistance: 100
    PvPToggle:
      Claim:
        Enabled: false
        Price: 0.0
      Subdivision:
        Enabled: false
        Price: 0.0
        DefaultState: INHERIT
  Siege:
    Worlds: []
    BreakableBlocks:
    - ACACIA_PLANKS
    - BIRCH_PLANKS
    - BLACK_WOOL
    - BLUE_WOOL
    - BROWN_WOOL
    - COBBLESTONE
    - CYAN_WOOL
    - DARK_OAK_PLANKS
    - DEAD_BUSH
    - DIRT
    - FERN
    - GLASS
    - GLASS_PANE
    - GRASS_BLOCK
    - GRAVEL
    - GRAY_WOOL
    - GREEN_WOOL
    - JUNGLE_PLANKS
    - LIGHT_BLUE_WOOL
    - LIGHT_GRAY_WOOL
    - LIME_WOOL
    - MAGENTA_WOOL
    - OAK_PLANKS
    - ORANGE_WOOL
    - PINK_WOOL
    - PURPLE_WOOL
    - RED_WOOL
    - SAND
    - SHORT_GRASS
    - SNOW
    - SPRUCE_PLANKS
    - WHITE_WOOL
    - YELLOW_WOOL
    DoorsOpenDelayInSeconds: 300
    CooldownEndInMinutes: 60
  ActionBarMessages:
  - UnprotectedChestWarning
  - ExternalLiquidBoundaryViolation
  - InternalLiquidBoundaryViolation
  - ExternalPistonBoundaryViolation
  - InternalPistonBoundaryViolation
  Economy:
    ClaimBlocksEnabled: false
    ClaimBlocksMaxBonus: 0
    ClaimBlocksPurchaseCost: 1.0
    ClaimBlocksSellValue: 0.5
  Spam:
    Enabled: true
    LoginCooldownSeconds: 60
    LoginLogoutNotificationsPerMinute: 5
    ChatSlashCommands: /me;/global;/local
    WhisperSlashCommands: /tell;/pm;/r;/whisper;/msg
    WarningMessage: Please reduce your noise level.  Spammers will be banned.
    BanOffenders: true
    BanMessage: Banned for spam.
    AllowedIpAddresses: 1.2.3.4; 5.6.7.8
    DeathMessageCooldownSeconds: 120
    Logout Message Delay In Seconds: 0
  PvP:
    RulesEnabledInWorld:
      world: true
      world_nether: true
      world_the_end: true
    ProtectFreshSpawns: true
    PunishLogout: true
    CombatTimeoutSeconds: 15
    AllowCombatItemDrop: false
    AllowContainerAccess: false
    AllowRespawnAnchor: false
    BlockedSlashCommands: /home;/vanish;/spawn;/tpa
    ProtectPlayersInLandClaims:
      PlayerOwnedClaims: true
      AdministrativeClaims: true
      AdministrativeSubdivisions: true
    AllowLavaDumpingNearOtherPlayers:
      PvPWorlds: true
      NonPvPWorlds: false
    AllowFlintAndSteelNearOtherPlayers:
      PvPWorlds: true
      NonPvPWorlds: false
    ProtectPetsOutsideLandClaims: false
  ProtectItemsDroppedOnDeath:
    PvPWorlds: false
    NonPvPWorlds: true
  BlockLandClaimExplosions: true
  BlockSurfaceCreeperExplosions: true
  BlockSurfaceOtherExplosions: true
  LimitSkyTrees: true
  LimitTreeGrowth: false
  PistonMovement: CLAIMS_ONLY
  PistonExplosionSound: true
  FireSpreads: false
  FireDestroys: false
  AdminsGetWhispers: true
  AdminsGetSignNotifications: true
  VisualizationAntiCheatCompatMode: false
  VisualizationGlow: false
  SmartBan: true
  Mute New Players Using Banned Words: true
  MaxPlayersPerIpAddress: 3
  SilenceBans: true
  EndermenMoveBlocks: false
  SilverfishBreakBlocks: false
  CreaturesTrampleCrops: false
  RabbitsEatCrops: true
  HardModeZombiesBreakDoors: false
  MobProjectilesChangeBlocks: false
  UseBanCommand: false
  BanCommandPattern: ban %name% %reason%
  Advanced:
    fixNegativeClaimblockAmounts: true
    ClaimExpirationCheckRate: 60
    OfflinePlayer_cache_days: 90
  Abridged Logs:
    Days To Keep: 7
    Included Entry Types:
      Social Activity: true
      Suspicious Activity: true
      Administrative Activity: false
      Debug: false
      Muted Chat Messages: false
  Locale: en
  PerPlayerLocale: true
  ConfigVersion: 1
