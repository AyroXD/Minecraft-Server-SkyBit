    win-limit-cooldown:
    - '&cWin limit cooldown: &e%cooldown%'
    global-win-limit-cooldown:
    - '&cGlobal win limit cooldown: &e%global_cooldown%'
    time-limited-expired:
    - '&cThis reward has expired.'
