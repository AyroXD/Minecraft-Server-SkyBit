reward:
  random-mode:
    name: '&7%reward_name%'
    lore:
    - '%reward_lore%'
    - ''
    - '&eYour chance: &6%chance%%'
    - ''
    - '&7(This lore is configured at the menus folder)'
  selective-mode:
    name: '&7%reward_name%'
    lore:
    - '%reward_lore%'
    - ''
    - '&eRequired Keys: &6%required_keys%'
    - '&eAmount Limit: &6%amount_limit%'
    - ''
    - '&7(This lore is configured at the menus folder)'
  extra:
    time-limited-reward:
      name: '&7%reward_name%'
      lore:
      - '%reward_lore%'
      - ''
      - '&eTime Left: &6%time%'
      - ''
      - '&7(This lore is configured at the menus folder)'
  locked:
    item:
      material: RED_STAINED_GLASS_PANE
      custom-model-data: 0
      item-model: ''
      glow: false
      display-name: '&7%reward_name% &c(Disabled)'
